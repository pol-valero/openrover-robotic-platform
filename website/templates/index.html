<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Chart.js for graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>

    <style>
        /* Dark Theme */
        body {
            background-color: #121212;
            color: #ffffff;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #1e1e1e;
            padding: 15px;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        /* Center Panels */
        .sensor-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .icon {
            font-size: 20px;
            margin-right: 8px;
        }

        .sensor-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .chart-container {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white" href="#">🤖 Robot Sensor Dashboard</a>
            <div class="navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Monitor</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Control</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container text-center mt-4">
        <div class="row justify-content-center">
            <!-- Temperature Card -->
            <div class="col-md-3">
                <div class="card sensor-card text-white">
                    <div class="card-body">
                        <h4><i class="fas fa-thermometer-half icon"></i> Temp</h4>
                        <p id="temperature" class="sensor-value">-- °C</p>
                    </div>
                </div>
            </div>

            <!-- Humidity Card -->
            <div class="col-md-3">
                <div class="card sensor-card text-white">
                    <div class="card-body">
                        <h4><i class="fas fa-tint icon"></i> Humidity</h4>
                        <p id="humidity" class="sensor-value">-- %</p>
                    </div>
                </div>
            </div>

            <!-- Battery Card -->
            <div class="col-md-3">
                <div class="card sensor-card text-white">
                    <div class="card-body">
                        <h4><i class="fas fa-battery-half icon"></i> Battery</h4>
                        <p id="battery" class="sensor-value">-- %</p>
                    </div>
                </div>
            </div>

             <!-- Battery Card -->
             <div class="col-md-3">
                <div class="card sensor-card text-white">
                    <div class="card-body">
                        <h4><i class="fas fa-battery-half icon"></i> Battery</h4>
                        <p id="battery" class="sensor-value">-- %</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Temperature Graph -->
        <div class="row mt-4">
            <div class="col-md-6 offset-md-3">
                <div class="chart-container">
                    <h4><i class="fas fa-chart-line icon"></i> Temperature Evolution</h4>
                    <canvas id="temperatureChart"></canvas>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-6 offset-md-3">
                    <div class="chart-container">
                        <h4><i class="fas fa-video icon"></i> Live Camera Feed</h4>
                        <img id="cameraFeed" src="" class="img-fluid rounded">
                        <br>
                        <button id="toggleFeed" class="btn btn-outline-light mt-3">Start Feed</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
